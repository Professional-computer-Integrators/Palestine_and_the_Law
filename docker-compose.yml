services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - TRUST_HOST=1
    volumes:
      # Persist analytics/session database outside the container lifecycle.
      - palestine_and_the_law_app_data:/app/data
    restart: unless-stopped

volumes:
  palestine_and_the_law_app_data:
    name: palestine_and_the_law_app_data
